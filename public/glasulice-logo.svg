<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#000000" stroke="#ff0000" stroke-width="4"/>
  
  <!-- GU letters with glitch effect -->
  <text x="100" y="130" font-family="Bebas Neue, cursive" font-size="80" font-weight="bold" text-anchor="middle" fill="#ff0000">
    GU
  </text>
  
  <!-- Underground symbol -->
  <path d="M 30 100 L 50 80 L 70 100 L 90 80 L 110 100 L 130 80 L 150 100 L 170 80" 
        stroke="#ff0000" stroke-width="3" fill="none" opacity="0.7"/>
  
  <!-- Noise texture overlay -->
  <rect width="200" height="200" fill="url(#noise)" opacity="0.1"/>
  
  <!-- Define noise pattern -->
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </defs>
</svg>
